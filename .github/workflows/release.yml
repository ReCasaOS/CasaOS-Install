name: release

# Cuts an installer release from components that have already been released
# by their own repositories. Nothing is compiled here: the six component
# checkouts only contribute their setup scripts to the compatibility overlay,
# and every binary digest the installer verifies is fetched from the
# component's own checksums.txt, or computed from the published tarball for
# the two releases that have none (the dashboard and the App Store). The App
# Store seed is mirrored from IceWhale's release into our own, so a new install
# depends only on assets we publish.
#
# Order of operations for a release, all under the same GitHub account:
#   1. tag and release each component (CasaOS, CasaOS-AppManagement,
#      CasaOS-Gateway, CasaOS-UserService, CasaOS-MessageBus,
#      CasaOS-LocalStorage, CasaOS-UI) and wait for their assets to exist
#   2. pin their tags and commits in release/components.env, commit
#   3. tag this repository with CASAOS_RELEASE_TAG - this workflow runs

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Assemble and publish the installer
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4

      # The module catalogue builder judges the titles of manifests by the Unicode
      # tables of the Python that runs it, and the core judges them by those of
      # the Go that builds it (15.0). The Python of ubuntu-22.04 is 3.10, whose
      # tables are those of Unicode 13.0: it refuses 5318 characters that the core
      # takes. 3.12 has 15.0, so the version is pinned here and not left to the image.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the installer's statistics functions
        run: bash scripts/test-install-telemetry.sh

      - name: Check what the installer says when a dependency cannot be installed
        run: bash scripts/test-install-dependencies.sh

      - name: Check the port the installer's closing banner shows
        run: bash scripts/test-install-banner.sh

      - name: Check how a pre-release is told from a release
        run: bash scripts/test-release-prerelease.sh

      - name: Check what the installer does with a module
        run: sh scripts/test-install-modules.sh

      - name: Check what the uninstaller does with a module
        run: sh scripts/test-uninstall-modules.sh

      - name: Load component pins
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' release/components.env >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            expected="$(grep '^CASAOS_RELEASE_TAG=' release/components.env | cut -d= -f2)"
            if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match CASAOS_RELEASE_TAG=${expected} in components.env" >&2
              exit 1
            fi
          fi

      - name: Checkout CasaOS
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS
          ref: ${{ env.CASAOS_COMMIT }}
          path: work/CasaOS

      - name: Checkout CasaOS-Gateway
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS-Gateway
          ref: ${{ env.CASAOS_GATEWAY_COMMIT }}
          path: work/CasaOS-Gateway

      - name: Checkout CasaOS-UserService
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS-UserService
          ref: ${{ env.CASAOS_USER_SERVICE_COMMIT }}
          path: work/CasaOS-UserService

      - name: Checkout CasaOS-LocalStorage
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS-LocalStorage
          ref: ${{ env.CASAOS_LOCAL_STORAGE_COMMIT }}
          path: work/CasaOS-LocalStorage

      - name: Checkout CasaOS-MessageBus
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS-MessageBus
          ref: ${{ env.CASAOS_MESSAGE_BUS_COMMIT }}
          path: work/CasaOS-MessageBus

      - name: Checkout CasaOS-AppManagement
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS-AppManagement
          ref: ${{ env.CASAOS_APP_MANAGEMENT_COMMIT }}
          path: work/CasaOS-AppManagement

      # The rules of the core's reader that the builder copies are held to its Go
      # source (pkg/osmodule) at the commit this release pins. A release that lists no
      # module pins a core that may not have the package, and the cases are skipped.
      - name: Check the module catalogue builder
        env:
          CORE_SOURCE: ${{ github.workspace }}/work/CasaOS
        run: python3 scripts/test-build-modules-catalogue.py

      # Only a release that lists a module builds the core, to run it: prove_modules_core.
      - name: Set up Go for the proof of the module assistant
        uses: actions/setup-go@v5
        with:
          go-version-file: work/CasaOS/go.mod
          cache: false

      - name: Assemble the release bundle
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/work
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: scripts/build-release-bundle.sh dist

      # Nothing else reads the published version.json before boxes do, and a
      # box that updates itself never installs a release whose published_at is
      # missing or unreadable: it would silently stop updating. It has to name
      # this release and say, in UTC, that it was built within the hour.
      - name: Check version.json
        run: |
          set -euo pipefail
          jq 'del(.change_log)' dist/version.json
          jq -e --arg t "${CASAOS_RELEASE_TAG}" \
            '(.published_at | fromdateiso8601) as $p | .version == $t and $p <= now and $p > now - 3600' \
            dist/version.json

      # The module catalogue is an asset only when release/modules.env lists a
      # module; fail_on_unmatched_files would refuse a pattern with no file. What
      # the build made and what is published have to be the same: a catalogue that
      # install.sh carries no digest of would be published for nobody to check, and
      # a digest of a catalogue that is not there would stop every install of the
      # catalogue. Either is a job that fails here, before anything is published.
      - name: Is there a module catalogue
        id: modules
        run: |
          set -euo pipefail
          files="$(ls dist/modules-catalogue-*.json 2>/dev/null || true)"
          digest="$(sed -n 's/^readonly CASAOS_MODULE_CATALOGUE_SHA256="\([0-9a-f]*\)"$/\1/p' dist/install.sh)"
          if [ -n "${files}" ] && [ -z "${digest}" ]; then
            echo "dist holds a module catalogue (${files}) that install.sh carries no digest of." >&2
            exit 1
          fi
          if [ -z "${files}" ] && [ -n "${digest}" ]; then
            echo "install.sh carries the digest of a module catalogue (${digest}) that was not built." >&2
            exit 1
          fi
          if [ -n "${files}" ]; then
            if [ "$(printf '%s\n' "${files}" | wc -l)" -ne 1 ]; then
              echo "dist holds more than one module catalogue: ${files}" >&2
              exit 1
            fi
            if [ "$(sha256sum "${files}" | cut -d' ' -f1)" != "${digest}" ]; then
              echo "the digest in install.sh (${digest}) is not the SHA-256 of ${files}." >&2
              exit 1
            fi
          fi
          { echo "files<<END"; echo "${files}"; echo "END"; } >> "$GITHUB_OUTPUT"

      # The release is published as a pre-release while release/PRERELEASE
      # exists in the tagged commit. Boxes (the in-app updater) and the
      # one-line install command read releases/latest, which GitHub works out
      # without pre-releases, so the release can be installed by its tag and
      # proven (docker-update-proof.yml, install-check.yml) before anybody is
      # offered it. To promote it:
      #   gh release edit <tag> -R ReCasaOS/CasaOS-Install --prerelease=false --latest
      # and delete release/PRERELEASE in the next commit.
      - name: Is this a pre-release
        id: pre
        run: echo "value=$(bash scripts/release-is-prerelease.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/install.sh
            dist/install.sh.sha256
            dist/casaos-uninstall
            dist/linux-zz-casaos-compat-overlay-*.tar.gz
            dist/linux-all-appstore-*.tar.gz
            dist/version.json
            dist/components.lock
            dist/checksums.txt
            ${{ steps.modules.outputs.files }}
          draft: false
          prerelease: ${{ steps.pre.outputs.value == 'true' }}
          fail_on_unmatched_files: true

  # Then install what was just published on a fresh machine and use it. Its own
  # workflow, so it can also be run by hand against any release without
  # publishing anything again.
  install-check:
    needs: release
    uses: ./.github/workflows/install-check.yml
    with:
      tag: ${{ github.ref_name }}
