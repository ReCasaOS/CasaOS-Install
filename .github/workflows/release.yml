name: release

# Cuts an installer release from components that have already been released
# by their own repositories. Nothing is compiled here: the six component
# checkouts only contribute their setup scripts to the compatibility overlay,
# and every binary digest the installer verifies is fetched from the
# component's own checksums.txt, or computed from the published tarball for
# the two releases that have none (the dashboard and the App Store). The App
# Store seed is mirrored from IceWhale's release into our own, so a new install
# depends only on assets we publish.
#
# Order of operations for a release, all under the same GitHub account:
#   1. tag and release each component (CasaOS, CasaOS-AppManagement,
#      CasaOS-Gateway, CasaOS-UserService, CasaOS-MessageBus,
#      CasaOS-LocalStorage, CasaOS-UI) and wait for their assets to exist
#   2. pin their tags and commits in release/components.env, commit
#   3. tag this repository with CASAOS_RELEASE_TAG - this workflow runs

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

# Every action is named by its commit: a tag is its owner's to move, and the
# jobs that publish and promote hold a token that can write to this repository.
# No checkout leaves that token behind for the steps that follow.
#
# Three jobs: assemble builds and tests dist/ (alone on anything but a pushed
# tag: a workflow_dispatch, even on a tag, is a dry run that publishes
# nothing); sign, in the release-signing
# environment (it waits for the owner's approval and alone sees the private
# key), writes install.sh.sig and checks it with release/installer-signing.pub;
# publish puts both on the release. A box's core runs an installer only when
# its signature is good.

jobs:
  assemble:
    name: Assemble and test the installer
    runs-on: ubuntu-22.04
    outputs:
      held: ${{ steps.pre.outputs.value }}
      modules: ${{ steps.modules.outputs.files }}
    steps:
      - name: Checkout installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The module catalogue builder judges the titles of manifests by the Unicode
      # tables of the Python that runs it, and the core judges them by those of
      # the Go that builds it (15.0). The Python of ubuntu-22.04 is 3.10, whose
      # tables are those of Unicode 13.0: it refuses 5318 characters that the core
      # takes. 3.12 has 15.0, so the version is pinned here and not left to the image.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check the installer's statistics functions
        run: bash scripts/test-install-telemetry.sh

      - name: Check what the installer says when a dependency cannot be installed
        run: bash scripts/test-install-dependencies.sh

      - name: Check what the installer does on derivatives and appliances
        run: bash scripts/test-install-distribution.sh

      - name: Check the port the installer's closing banner shows
        run: bash scripts/test-install-banner.sh

      - name: Check how the installer leaves casaos.service
        run: bash scripts/test-install-detach.sh

      - name: Check that an update from the dashboard never installs Docker
        run: bash scripts/test-install-docker-update.sh

      - name: Check that nobody is offered a release before the install check
        run: bash scripts/test-release-workflow.sh

      - name: Check how a pre-release is told from a release
        run: bash scripts/test-release-prerelease.sh

      - name: Check what the installer does with a module
        run: sh scripts/test-install-modules.sh

      - name: Check what the uninstaller does with a module
        run: sh scripts/test-uninstall-modules.sh

      - name: Check the fetch of the modules' releases
        run: bash scripts/test-stage-modules.sh

      - name: Check the installer and the uninstaller on boxes that are not the usual one
        run: bash scripts/test-install-hard-cases.sh

      - name: Load component pins
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' release/components.env >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            expected="$(grep '^CASAOS_RELEASE_TAG=' release/components.env | cut -d= -f2)"
            if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match CASAOS_RELEASE_TAG=${expected} in components.env" >&2
              exit 1
            fi
          fi

      - name: Checkout CasaOS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/CasaOS
          ref: ${{ env.CASAOS_COMMIT }}
          path: work/CasaOS

      - name: Checkout CasaOS-Gateway
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/CasaOS-Gateway
          ref: ${{ env.CASAOS_GATEWAY_COMMIT }}
          path: work/CasaOS-Gateway

      - name: Checkout CasaOS-UserService
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/CasaOS-UserService
          ref: ${{ env.CASAOS_USER_SERVICE_COMMIT }}
          path: work/CasaOS-UserService

      - name: Checkout CasaOS-LocalStorage
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/CasaOS-LocalStorage
          ref: ${{ env.CASAOS_LOCAL_STORAGE_COMMIT }}
          path: work/CasaOS-LocalStorage

      - name: Checkout CasaOS-MessageBus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/CasaOS-MessageBus
          ref: ${{ env.CASAOS_MESSAGE_BUS_COMMIT }}
          path: work/CasaOS-MessageBus

      - name: Checkout CasaOS-AppManagement
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/CasaOS-AppManagement
          ref: ${{ env.CASAOS_APP_MANAGEMENT_COMMIT }}
          path: work/CasaOS-AppManagement

      # The rules of the core's reader that the builder copies are held to its Go
      # source (pkg/osmodule) at the commit this release pins. A release that lists no
      # module pins a core that may not have the package, and the cases are skipped.
      - name: Check the module catalogue builder
        env:
          CORE_SOURCE: ${{ github.workspace }}/work/CasaOS
        run: python3 scripts/test-build-modules-catalogue.py

      # Only a release that lists a module builds the core, to run it: prove_modules_core.
      - name: Set up Go for the proof of the module assistant
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: work/CasaOS/go.mod
          cache: false

      - name: Check the tool that signs the installer
        run: go -C tools/installer-sign test ./...

      - name: Assemble the release bundle
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/work
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: scripts/build-release-bundle.sh dist

      # A box runs an installer only when its core trusts the key that signed it:
      # built against the pinned core, its installersig.Keys has to hold exactly
      # two distinct keys, one of them the key of release/installer-signing.pub;
      # and the installer has to announce the release it is published under.
      - name: Check that the pinned core trusts the signing key
        run: |
          set -euo pipefail
          bash scripts/check-core-keys.sh work/CasaOS release/installer-signing.pub
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] &&
            ! grep -qx "readonly CASAOS_INSTALL_RELEASE_TAG=\"${GITHUB_REF_NAME}\"" dist/install.sh; then
            echo "dist/install.sh does not announce the release ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      # Nothing else reads the published version.json before boxes do, and a
      # box that updates itself never installs a release whose published_at is
      # missing or unreadable: it would silently stop updating. It has to name
      # this release and say, in UTC, that it was built within the hour.
      - name: Check version.json
        run: |
          set -euo pipefail
          jq 'del(.change_log)' dist/version.json
          jq -e --arg t "${CASAOS_RELEASE_TAG}" \
            '(.published_at | fromdateiso8601) as $p | .version == $t and $p <= now and $p > now - 3600' \
            dist/version.json

      # The module catalogue is an asset only when release/modules.env lists a
      # module; fail_on_unmatched_files would refuse a pattern with no file. What
      # the build made and what is published have to be the same: a catalogue that
      # install.sh carries no digest of would be published for nobody to check, and
      # a digest of a catalogue that is not there would stop every install of the
      # catalogue. Either is a job that fails here, before anything is published.
      - name: Is there a module catalogue
        id: modules
        run: |
          set -euo pipefail
          files="$(ls dist/modules-catalogue-*.json 2>/dev/null || true)"
          digest="$(sed -n 's/^readonly CASAOS_MODULE_CATALOGUE_SHA256="\([0-9a-f]*\)"$/\1/p' dist/install.sh)"
          if [ -n "${files}" ] && [ -z "${digest}" ]; then
            echo "dist holds a module catalogue (${files}) that install.sh carries no digest of." >&2
            exit 1
          fi
          if [ -z "${files}" ] && [ -n "${digest}" ]; then
            echo "install.sh carries the digest of a module catalogue (${digest}) that was not built." >&2
            exit 1
          fi
          if [ -n "${files}" ]; then
            if [ "$(printf '%s\n' "${files}" | wc -l)" -ne 1 ]; then
              echo "dist holds more than one module catalogue: ${files}" >&2
              exit 1
            fi
            if [ "$(sha256sum "${files}" | cut -d' ' -f1)" != "${digest}" ]; then
              echo "the digest in install.sh (${digest}) is not the SHA-256 of ${files}." >&2
              exit 1
            fi
          fi
          { echo "files<<END"; echo "${files}"; echo "END"; } >> "$GITHUB_OUTPUT"

      # What is published here is always a pre-release. Boxes (the in-app
      # updater) and the one-line install command read releases/latest, which
      # GitHub works out without pre-releases, so nobody is offered the release
      # before the install check below has passed: the promote job is what makes
      # it the latest one.
      #
      # release/PRERELEASE in the tagged commit holds it back even then, for a
      # release that has more to prove (docker-update-proof.yml, an upgrade
      # proof) before anybody is offered it. To promote that one by hand:
      #   gh release edit <tag> -R ReCasaOS/CasaOS-Install --prerelease=false --latest
      # and delete release/PRERELEASE in the next commit.
      - name: Is this release held back as a pre-release
        id: pre
        run: echo "value=$(bash scripts/release-is-prerelease.sh)" >> "$GITHUB_OUTPUT"

      - name: Hand dist to the jobs that sign and publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # as long as GitHub lets an approval wait
          retention-days: 30

  # Signs exactly the install.sh that was assembled and tested, and refuses to
  # hand on a signature that the repository's public key does not accept.
  sign:
    name: Sign the installer
    needs: assemble
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    environment: release-signing
    permissions:
      contents: read
    outputs:
      install_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/installer-sign/go.mod
          cache: false

      - name: Build the signing tool
        run: go -C tools/installer-sign build -o "${RUNNER_TEMP}/installer-sign" .

      - name: Fetch the assembled installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Sign install.sh
        env:
          INSTALLER_SIGNING_KEY: ${{ secrets.INSTALLER_SIGNING_KEY }}
        run: '"${RUNNER_TEMP}/installer-sign" sign --key-env INSTALLER_SIGNING_KEY dist/install.sh'

      - name: Check the signature with the repository's public key
        run: '"${RUNNER_TEMP}/installer-sign" verify --pub release/installer-signing.pub dist/install.sh'

      - name: The digest of what was signed
        id: digest
        run: echo "sha256=$(sha256sum dist/install.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Hand the signature to the job that publishes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signature
          path: dist/install.sh.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the installer
    needs: [assemble, sign]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # the SBOM describes the source the installer was built from
      - name: Checkout installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch the assembled release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Fetch the signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signature
          path: dist

      - name: Generate the SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: installer-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # The approval of the signature can come days after the build, and a box's
      # automatic update counts its one-day wait from version.json's published_at,
      # stamped at the build: a build older than 6 hours is not published.
      - name: Check that what is published is what was signed, and recent
        env:
          SIGNED_SHA256: ${{ needs.sign.outputs.install_sha256 }}
        run: |
          set -euo pipefail
          if [ "$(sha256sum dist/install.sh | cut -d' ' -f1)" != "${SIGNED_SHA256}" ]; then
            echo "dist/install.sh is not the file that was signed." >&2
            exit 1
          fi
          if ! jq -e '(.published_at | fromdateiso8601) > now - 21600' dist/version.json >/dev/null; then
            echo "the build is older than 6 hours: use Re-run all jobs to rebuild and sign again" >&2
            exit 1
          fi

      # Only what this workflow builds: not the App Store seed, which is mirrored.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/install.sh
            dist/install.sh.sig
            dist/linux-zz-casaos-compat-overlay-*.tar.gz
            ${{ needs.assemble.outputs.modules }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/install.sh
            dist/install.sh.sig
            dist/linux-zz-casaos-compat-overlay-*.tar.gz
            ${{ needs.assemble.outputs.modules }}
          sbom-path: installer-${{ github.ref_name }}.spdx.json

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/install.sh.sig
            dist/install.sh
            dist/install.sh.sha256
            dist/casaos-uninstall
            dist/linux-zz-casaos-compat-overlay-*.tar.gz
            dist/linux-all-appstore-*.tar.gz
            dist/version.json
            dist/components.lock
            dist/checksums.txt
            ${{ needs.assemble.outputs.modules }}
            installer-${{ github.ref_name }}.spdx.json
          draft: false
          prerelease: true
          fail_on_unmatched_files: true

  # Then install what was just published on a fresh machine and use it. Its own
  # workflow, so it can also be run by hand against any release without
  # publishing anything again.
  install-check:
    needs: publish
    uses: ./.github/workflows/install-check.yml
    with:
      tag: ${{ github.ref_name }}

  # Only a release that passed the check on every leg is offered to boxes. A leg
  # that failed for a reason of its own (a mirror that was down) is run again
  # with "Re-run failed jobs", and this job with it. Not with "Re-run all jobs":
  # that publishes again, and what is published is a pre-release.
  promote:
    name: Offer the release to boxes
    needs: [assemble, install-check]
    if: github.ref_type == 'tag' && needs.assemble.outputs.held == 'false'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Make it the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never over a newer release: two tags can be in the check at once, and
          # the run of an old tag can be started again.
          latest="$(gh release view -R "${GITHUB_REPOSITORY}" --json tagName -q .tagName || true)"
          if [ "$(printf '%s\n%s\n' "${latest}" "${GITHUB_REF_NAME}" | sort -V | tail -n 1)" != "${GITHUB_REF_NAME}" ]; then
            echo "${latest} is the latest release and is newer: ${GITHUB_REF_NAME} stays a pre-release."
            exit 0
          fi
          gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --prerelease=false --latest
