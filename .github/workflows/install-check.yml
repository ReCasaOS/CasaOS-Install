name: install-check

# Install a published release on a fresh machine and use it.
#
# Every release before v0.4.72 was cut without anybody running install.sh from
# the published bundle: the digests were checked against the component
# releases, and that was all. This is the missing half. It runs the installer
# exactly as the README says to, on the runner itself (a full VM with systemd,
# which a container is not), then drives the box through the first-boot path a
# person would take: services up, dashboard answering, first user, an app
# installed, a backup of it made through rclone and found on disk.
#
# Called by release.yml after every publish, and runnable by hand against any
# tag -- which publishes nothing again. Red does not unpublish anything; it is
# the alarm.

on:
  workflow_call:
    inputs:
      tag:
        description: The installer release to install (a tag of this repository)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The installer release to install (a tag of this repository)
        required: true
        type: string

permissions:
  contents: read

jobs:
  install-check:
    name: Install the published bundle and use it (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # The Raspberry Pi is the machine CasaOS is most often installed on, and
    # no release had been installed on an arm64 machine before v0.4.83. The
    # legs are independent: a red arm64 does not stop the amd64 evidence.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
      DEBIAN_FRONTEND: noninteractive
      TAG: ${{ inputs.tag }}
    steps:
      - name: Fetch the published installer
        run: |
          set -euo pipefail
          gh release download "${TAG}" -R "${GITHUB_REPOSITORY}" \
            -p install.sh -p install.sh.sha256 -p components.lock
          sha256sum --check install.sh.sha256
          grep -E '^(CASAOS_RELEASE_TAG|RCLONE_TAG|CASAOS_UI_TAG)=' components.lock >> "$GITHUB_ENV"

      - name: Run the installer as the README says
        run: |
          set -euo pipefail
          sudo -E bash install.sh 2>&1 | tee install.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Every service is up, and it is this release
        run: |
          set -euo pipefail
          for unit in casaos-gateway casaos-message-bus casaos-user-service casaos-local-storage casaos-app-management rclone casaos; do
            state="$(systemctl is-active "${unit}.service" || true)"
            echo "${unit}: ${state}"
            test "${state}" = active
          done
          marker="$(cat /var/lib/casaos/fork-release)"
          echo "fork-release marker: ${marker}"
          test "${marker}" = "${CASAOS_RELEASE_TAG}"
          version="$(rclone --version | head -n 1)"
          echo "rclone: ${version}"
          test "${version}" = "rclone ${RCLONE_TAG}"
          test -S /var/run/rclone/rclone.sock

      # No service may fail its first start. Two did on every install until v0.4.78;
      # the journals are printed so a red run says which one, and why.
      - name: First-start journals
        if: always()
        run: |
          if grep -n 'Job for' install.log; then echo 'a service failed its first start'; failed=1; else echo 'no first-start failure in the install log'; failed=0; fi
          for unit in casaos-message-bus casaos-local-storage casaos-gateway; do
            echo "::group::${unit}"
            sudo journalctl -u "${unit}.service" --no-pager -o short-iso | head -n 60
            echo "::endgroup::"
          done
          test "${failed}" -eq 0

      - name: The dashboard answers
        run: |
          set -euo pipefail
          port="$(sed -nE 's/^[[:space:]]*HttpPort[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' /etc/casaos/gateway.ini | head -n 1)"
          port="${port:-80}"
          echo "gateway port: ${port}"
          echo "CASA_URL=http://127.0.0.1:${port}" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/" || true)"
            [ "${code}" = 200 ] && break
            sleep 2
          done
          test "${code}" = 200

      # Since v0.4.84 the gateway serves the same routes over HTTPS on 443 with
      # a certificate it made for itself, beside the plain port, when none is
      # configured. Self-signed, so curl is told not to verify the chain; what
      # is verified is that the dashboard and the API answer there, that the
      # certificate is the gateway's own, and that its key is root's alone.
      - name: HTTPS on 443 with the gateway's own certificate
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            curl -k -fsS -o /dev/null https://127.0.0.1:443/ && break
            sleep 3
          done
          curl -k -fsS -o /dev/null https://127.0.0.1:443/
          curl -k -fsS https://127.0.0.1:443/ping | grep -q pong
          subject="$(openssl s_client -connect 127.0.0.1:443 </dev/null 2>/dev/null | openssl x509 -noout -subject)"
          echo "${subject}"
          grep -q -E 'CN *= *CasaOS' <<<"${subject}"
          test "$(sudo stat -c '%a %U' /var/lib/casaos/tls/gateway.key)" = "600 root"
          echo "https answers with the gateway's own certificate"

      - name: First user, then a token
        run: |
          set -euo pipefail
          key="$(curl -fsS "${CASA_URL}/v1/users/status" | jq -r '.data.key')"
          test -n "${key}" && test "${key}" != null
          curl -fsS -X POST "${CASA_URL}/v1/users/register" -H 'content-type: application/json' \
            -d "{\"username\":\"smoke\",\"password\":\"Smoke-test-1\",\"key\":\"${key}\"}" >/dev/null
          token="$(curl -fsS -X POST "${CASA_URL}/v1/users/login" -H 'content-type: application/json' \
            -d '{"username":"smoke","password":"Smoke-test-1"}' | jq -r '.data.token.access_token')"
          test -n "${token}" && test "${token}" != null
          echo "::add-mask::${token}"
          echo "CASA_TOKEN=${token}" >> "$GITHUB_ENV"

      # Every service used to trust any request from 127.0.0.1, and a container
      # on the host network or any local account reaches the same addresses.
      # Since v0.4.83 a request is one of ours when it carries the secret the
      # gateway wrote for this boot, readable by root only; anything else needs
      # a person's token, from loopback like from the network. Here: the routes
      # that used to be open to loopback answer 401 without either, a service's
      # call with the secret goes through, and the management API on its own
      # port wants the same.
      - name: Loopback alone is not a service
        run: |
          set -euo pipefail
          for path in /v2/app_management/compose '/v1/file?path=/etc/shadow' /v1/users/current /v1/storage /v1/sys/debug /v1/gateway/port; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${CASA_URL}${path}")"
            echo "${path}: ${code}"
            test "${code}" = 401
          done
          secret="$(sudo cat /var/run/casaos/internal.secret)"
          test "${#secret}" -eq 64
          test "$(sudo stat -c '%a %U' /var/run/casaos/internal.secret)" = "600 root"
          # what local-storage posts to the core every five seconds
          curl -fsS -o /dev/null -X POST "${CASA_URL}/v1/notify/system_status" -H "Authorization: Internal ${secret}" -H 'content-type: application/json' -d '{}'
          # and the wrong secret is nobody
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "${CASA_URL}/v1/notify/system_status" -H "Authorization: Internal $(printf '0%.0s' $(seq 1 64))" -H 'content-type: application/json' -d '{}')" = 401
          management="$(sudo cat /var/run/casaos/management.url)"
          test "$(curl -s -o /dev/null -w '%{http_code}' "${management}/v1/gateway/routes")" = 401
          curl -fsS -o /dev/null "${management}/v1/gateway/routes" -H "Authorization: Internal ${secret}"
          echo "loopback alone is nobody; the secret is a service"

      # A destination is an rclone remote. `alias` onto a directory keeps the
      # test on this machine while going through exactly the same daemon, the
      # same socket and the same rc calls an S3 bucket would.
      - name: A backup destination, and the daemon answers for it
        run: |
          set -euo pipefail
          sudo mkdir -p /var/tmp/casaos-backup-smoke
          curl -fsS -X PUT "${CASA_URL}/v2/app_management/backup/destinations/smoke" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
            -d '{"backend":"alias","parameters":{"remote":"/var/tmp/casaos-backup-smoke"}}' | jq .
          curl -fsS -X POST "${CASA_URL}/v2/app_management/backup/destinations/smoke/check" \
            -H "Authorization: ${CASA_TOKEN}" | jq .

      - name: An app, from a compose file
        run: |
          set -euo pipefail
          sudo mkdir -p /DATA/AppData/smoke/html
          echo "hello from ${CASAOS_RELEASE_TAG}" | sudo tee /DATA/AppData/smoke/html/index.html >/dev/null
          cat > smoke.yml <<'YAML'
          name: smoke
          services:
            web:
              image: nginx:alpine
              container_name: smoke
              volumes:
                - /DATA/AppData/smoke/html:/usr/share/nginx/html:ro
          x-casaos:
            main: web
            title:
              en_us: Smoke
          YAML
          curl -fsS -X POST "${CASA_URL}/v2/app_management/compose" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/yaml' \
            --data-binary @smoke.yml | jq .
          for _ in $(seq 1 60); do
            docker ps --format '{{.Names}} {{.Status}}' | grep -q '^smoke Up' && break
            sleep 3
          done
          docker ps --format '{{.Names}} {{.Status}}' | grep '^smoke Up'

      - name: A backup of it, through rclone, found on disk
        run: |
          set -euo pipefail
          curl -fsS -X POST "${CASA_URL}/v2/app_management/compose/smoke/backup" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
            -d '{"destination":"smoke","hold_still":true}' | jq .
          for _ in $(seq 1 40); do
            run="$(curl -fsS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
              | jq -c '.data // [] | map(select(.app == "smoke")) | first // empty')"
            [ -n "${run}" ] && [ "$(jq -r '.finished_at' <<<"${run}")" != "0001-01-01T00:00:00Z" ] && break
            sleep 3
          done
          echo "run: ${run}"
          test -n "${run}"
          test "$(jq -r '.error // ""' <<<"${run}")" = ""
          test "$(jq -r '.containers_stopped' <<<"${run}")" = true
          sudo find /var/tmp/casaos-backup-smoke -type f | tee backup-files.txt
          grep -q 'index.html$' backup-files.txt
          grep -q 'manifest' backup-files.txt
          # the app came back after being held still for the copy
          docker ps --format '{{.Names}} {{.Status}}' | grep '^smoke Up'

      # The other direction. The file the backup holds is overwritten, the
      # restore is asked for, and the original content has to be back -- through
      # the same daemon, with the app held still and started again.
      - name: A restore of it, from that backup
        run: |
          set -euo pipefail
          stamp="$(curl -fsS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
            | jq -r '.data // [] | map(select(.app == "smoke" and .restore != true and (.error // "") == "")) | first | .stamp')"
          test -n "${stamp}" && test "${stamp}" != null
          echo "restoring from ${stamp}"
          echo "changed after the backup" | sudo tee /DATA/AppData/smoke/html/index.html >/dev/null
          echo "an extra file" | sudo tee /DATA/AppData/smoke/html/extra.txt >/dev/null
          curl -fsS -X POST "${CASA_URL}/v2/app_management/backup/restore" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
            -d "{\"destination\":\"smoke\",\"app\":\"smoke\",\"stamp\":\"${stamp}\"}" | jq .
          for _ in $(seq 1 40); do
            run="$(curl -fsS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
              | jq -c '.data // [] | map(select(.app == "smoke" and .restore == true)) | first // empty')"
            [ -n "${run}" ] && break
            sleep 3
          done
          echo "restore run: ${run}"
          test -n "${run}"
          test "$(jq -r '.error // ""' <<<"${run}")" = ""
          # as it was: the content is back, and the file added since is gone
          test "$(cat /DATA/AppData/smoke/html/index.html)" = "hello from ${CASAOS_RELEASE_TAG}"
          test ! -e /DATA/AppData/smoke/html/extra.txt
          docker ps --format '{{.Names}} {{.Status}}' | grep '^smoke Up'

      # The case a backup exists for: the app is gone, with its data. The
      # destination is asked what it holds, the app must show as not installed,
      # and a restore has to install it from the compose file the backup kept
      # and put its data back -- through the same door a fresh box would use.
      - name: A restore of it when it is not installed any more
        run: |
          set -euo pipefail
          stamp="$(curl -fsS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
            | jq -r '.data // [] | map(select(.app == "smoke" and .restore != true and (.error // "") == "")) | first | .stamp')"
          test -n "${stamp}" && test "${stamp}" != null
          curl -fsS -X DELETE "${CASA_URL}/v2/app_management/compose/smoke?delete_config_folder=true" \
            -H "Authorization: ${CASA_TOKEN}" | jq .
          for _ in $(seq 1 30); do
            docker ps -a --format '{{.Names}}' | grep -q '^smoke$' || break
            sleep 2
          done
          docker ps -a --format '{{.Names}}' | grep -q '^smoke$' && { echo "smoke is still there"; exit 1; }
          sudo rm -rf /DATA/AppData/smoke
          test ! -e /DATA/AppData/smoke/html/index.html
          held="$(curl -fsS "${CASA_URL}/v2/app_management/backup/destinations/smoke/runs" -H "Authorization: ${CASA_TOKEN}")"
          echo "${held}" | jq .
          test "$(jq -r '.data | map(select(.app == "smoke")) | first | .installed' <<<"${held}")" = false
          jq -e --arg s "${stamp}" '.data | map(select(.app == "smoke")) | first | .stamps | index($s) != null' <<<"${held}" >/dev/null
          # the run log already holds the restore from the step above; only one
          # started after this moment counts, and installing takes longer than
          # putting files back into an app that is there
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 1
          curl -fsS -X POST "${CASA_URL}/v2/app_management/backup/restore" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
            -d "{\"destination\":\"smoke\",\"app\":\"smoke\",\"stamp\":\"${stamp}\"}" | jq .
          for _ in $(seq 1 100); do
            run="$(curl -fsS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
              | jq -c --arg b "${before}" '.data // [] | map(select(.app == "smoke" and .restore == true and .started_at > $b)) | first // empty')"
            [ -n "${run}" ] && break
            sleep 3
          done
          echo "restore run: ${run}"
          test -n "${run}"
          test "$(jq -r '.error // ""' <<<"${run}")" = ""
          test "$(cat /DATA/AppData/smoke/html/index.html)" = "hello from ${CASAOS_RELEASE_TAG}"
          docker ps --format '{{.Names}} {{.Status}}' | grep '^smoke Up'
          test -f /var/lib/casaos/apps/smoke/docker-compose.yml

      # The same backup through a destination that encrypts: nothing readable
      # lands on disk, everything is readable back through the remote, and the
      # restore does not know the difference. Then one backup is deleted and
      # the destination stops listing it.
      - name: An encrypted destination, and deleting a backup
        run: |
          set -euo pipefail
          sudo mkdir -p /var/tmp/casaos-backup-vault
          curl -fsS -X PUT "${CASA_URL}/v2/app_management/backup/destinations/vault" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
            -d '{"backend":"alias","parameters":{"remote":"/var/tmp/casaos-backup-vault"},"encrypt":true,"password":"smoke-test-vault"}' | jq .
          curl -fsS -X POST "${CASA_URL}/v2/app_management/backup/destinations/vault/check" -H "Authorization: ${CASA_TOKEN}" | jq .
          # the raw remote underneath is not a destination
          curl -fsS "${CASA_URL}/v2/app_management/backup/destinations" -H "Authorization: ${CASA_TOKEN}" | jq -e '.data | index("vault") != null and index("vault-raw") == null' >/dev/null
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 1
          curl -fsS -X POST "${CASA_URL}/v2/app_management/compose/smoke/backup" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
            -d '{"destination":"vault","hold_still":true}' | jq .
          for _ in $(seq 1 40); do
            run="$(curl -fsS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
              | jq -c --arg b "${before}" '.data // [] | map(select(.app == "smoke" and .destination == "vault" and .restore != true and .started_at > $b)) | first // empty')"
            [ -n "${run}" ] && [ "$(jq -r '.finished_at' <<<"${run}")" != "0001-01-01T00:00:00Z" ] && break
            sleep 3
          done
          echo "vault run: ${run}"
          test -n "${run}"
          test "$(jq -r '.error // ""' <<<"${run}")" = ""
          # nothing readable on disk: no file is named index.html or manifest.json
          sudo find /var/tmp/casaos-backup-vault -type f | tee vault-files.txt
          test "$(wc -l < vault-files.txt)" -gt 0
          ! grep -qE 'index.html|manifest.json' vault-files.txt
          # everything readable through the remote
          sudo rclone lsf -R "casaos-backup-vault:smoke/" | tee vault-listing.txt
          grep -q 'manifest.json$' vault-listing.txt
          grep -q 'index.html$' vault-listing.txt
          stamp="$(jq -r '.stamp' <<<"${run}")"
          # what the destination holds, then one backup less
          curl -fsS "${CASA_URL}/v2/app_management/backup/destinations/vault/runs" -H "Authorization: ${CASA_TOKEN}" \
            | jq -e --arg s "${stamp}" '.data | map(select(.app == "smoke")) | first | .stamps | index($s) != null' >/dev/null
          curl -fsS -X DELETE "${CASA_URL}/v2/app_management/backup/destinations/vault/runs/smoke/${stamp}" -H "Authorization: ${CASA_TOKEN}" | jq .
          held="$(curl -fsS "${CASA_URL}/v2/app_management/backup/destinations/vault/runs" -H "Authorization: ${CASA_TOKEN}")"
          echo "${held}" | jq .
          test "$(jq -r --arg s "${stamp}" '.data // [] | map(select(.app == "smoke")) | first // {stamps: []} | .stamps | index($s)' <<<"${held}")" = null
          # and the run log kept its record
          curl -fsS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
            | jq -e --arg s "${stamp}" '.data | map(select(.stamp == $s and .destination == "vault")) | length == 1' >/dev/null

      # The box itself: a marker in its own state goes out with the backup, is
      # deleted, and comes back with the restore -- with the services that hold
      # those files stopped for the copy in both directions and active again.
      - name: The box itself, out and back
        run: |
          set -euo pipefail
          # The polls below run while user-service is stopped for the copy. A token
          # is checked against a key fetched from user-service every ten seconds;
          # since Common v0.4.25 the key last seen serves while it is down, but a
          # box whose app-management never saw one has nothing to check with. So
          # the polls do not fail on the status, they keep polling; a real refusal
          # still ends in the `test -n` below.
          sudo mkdir -p /var/lib/casaos/conf
          echo "box marker ${CASAOS_RELEASE_TAG}" | sudo tee /var/lib/casaos/conf/install-check-marker >/dev/null
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 1
          curl -fsS -X POST "${CASA_URL}/v2/app_management/backup/system" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
            -d '{"destination":"smoke","hold_still":true}' | jq .
          for _ in $(seq 1 60); do
            run="$(curl -sS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
              | jq -c --arg b "${before}" '.data // [] | map(select(.app == "casaos-system" and .restore != true and .started_at > $b)) | first // empty')"
            [ -n "${run}" ] && [ "$(jq -r '.finished_at' <<<"${run}")" != "0001-01-01T00:00:00Z" ] && break
            sleep 3
          done
          echo "box backup run: ${run}"
          test -n "${run}"
          test "$(jq -r '.error // ""' <<<"${run}")" = ""
          sudo find /var/tmp/casaos-backup-smoke/casaos-system -type f | tee box-files.txt
          grep -q 'install-check-marker$' box-files.txt
          grep -q 'rclone.conf$' box-files.txt
          for unit in casaos casaos-user-service casaos-local-storage; do test "$(systemctl is-active ${unit}.service)" = active; done
          # the destination knows the box, and knows it is here
          curl -fsS "${CASA_URL}/v2/app_management/backup/destinations/smoke/runs" -H "Authorization: ${CASA_TOKEN}" \
            | jq -e '.data | map(select(.app == "casaos-system")) | first | .installed == true' >/dev/null
          stamp="$(jq -r '.stamp' <<<"${run}")"
          sudo rm -f /var/lib/casaos/conf/install-check-marker
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 1
          curl -fsS -X POST "${CASA_URL}/v2/app_management/backup/restore" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
            -d "{\"destination\":\"smoke\",\"app\":\"casaos-system\",\"stamp\":\"${stamp}\"}" | jq .
          for _ in $(seq 1 60); do
            run="$(curl -sS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
              | jq -c --arg b "${before}" '.data // [] | map(select(.app == "casaos-system" and .restore == true and .started_at > $b)) | first // empty')"
            [ -n "${run}" ] && break
            sleep 3
          done
          echo "box restore run: ${run}"
          test -n "${run}"
          test "$(jq -r '.error // ""' <<<"${run}")" = ""
          test "$(cat /var/lib/casaos/conf/install-check-marker)" = "box marker ${CASAOS_RELEASE_TAG}"
          for unit in casaos casaos-user-service casaos-local-storage rclone; do test "$(systemctl is-active ${unit}.service)" = active; done
          # the dashboard is back, and so is the login
          port="$(sed -nE 's/^[[:space:]]*HttpPort[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' /etc/casaos/gateway.ini | head -n 1)"
          curl -fsS -o /dev/null "http://127.0.0.1:${port:-80}/"
          curl -fsS -X POST "${CASA_URL}/v1/users/login" -H 'content-type: application/json' \
            -d '{"username":"smoke","password":"Smoke-test-1"}' | jq -e '.data.token.access_token != null' >/dev/null

      # A backup somebody asks for carries a retention since v0.4.84: once it has
      # landed, older backups of that app at that destination beyond `keep` are
      # deleted, by the arithmetic a schedule already used. Two backups with
      # keep=1, and one is left on disk.
      - name: A retention on demand
        run: |
          set -euo pipefail
          for i in 1 2; do
            before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 1
            curl -fsS -X POST "${CASA_URL}/v2/app_management/compose/smoke/backup" \
              -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
              -d '{"destination":"smoke","hold_still":false,"keep":1}' | jq -c .
            for _ in $(seq 1 40); do
              run="$(curl -fsS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
                | jq -c --arg b "${before}" '.data // [] | map(select(.app == "smoke" and .restore != true and .started_at > $b)) | first // empty')"
              [ -n "${run}" ] && [ "$(jq -r '.finished_at' <<<"${run}")" != "0001-01-01T00:00:00Z" ] && break
              sleep 3
            done
            echo "run ${i}: ${run}"
            test -n "${run}"
            test "$(jq -r '.error // ""' <<<"${run}")" = ""
            sleep 2
          done
          sudo find /var/tmp/casaos-backup-smoke/smoke -mindepth 1 -maxdepth 1 -type d | tee kept.txt
          test "$(wc -l < kept.txt)" -eq 1
          echo "one backup kept, the older ones gone"

      # Every app at once, since v0.4.86: what an update would do is listed first
      # (the plan asks the registries), then the box runs the apps given one after
      # another on its own and says what became of each. The smoke app came from a
      # compose file naming nginx:alpine: the run leaves it current, or re-pulls
      # it if the registry moved that tag since the install; neither is a failure.
      - name: Every app at once
        run: |
          set -euo pipefail
          plan="$(curl -fsS --max-time 300 "${CASA_URL}/v2/app_management/compose/updates?check=true" -H "Authorization: ${CASA_TOKEN}")"
          echo "${plan}" | jq -c '.data.apps | map({id, kind, services: (.services | length)})'
          jq -e '.data.apps | type == "array"' <<<"${plan}" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "${CASA_URL}/v2/app_management/compose/updates" -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' -d '{"ids":[]}')" = 400
          curl -fsS -X POST "${CASA_URL}/v2/app_management/compose/updates" -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' -d '{"ids":["smoke"]}' | jq -c '.data.apps'
          run=""
          for _ in $(seq 1 60); do
            run="$(curl -fsS "${CASA_URL}/v2/app_management/compose/updates/run" -H "Authorization: ${CASA_TOKEN}")"
            [ "$(jq -r '.data.finished_at // ""' <<<"${run}")" != "" ] && break
            sleep 3
          done
          echo "${run}" | jq -c '.data'
          jq -e '.data.finished_at != null and (.data.apps | length == 1) and (.data.apps[0].state | IN("updated", "current"))' <<<"${run}" >/dev/null
          test "$(docker inspect -f '{{.State.Running}}' smoke)" = true
          echo "every app at once: smoke is $(jq -r '.data.apps[0].state' <<<"${run}") and running"

      # The copy of the catalogue this distribution keeps (github.com/ReCasaOS/
      # _appstore, IceWhale's store/main.zip taken every night) is what
      # AppManagement fetches when IceWhale's URL stops answering. It has to be a
      # store: a zip with the apps in it.
      - name: The catalogue's copy is a store
        run: |
          set -euo pipefail
          curl -fsSL -o mirror.zip https://raw.githubusercontent.com/ReCasaOS/_appstore/main/store/main.zip
          apps="$(unzip -l mirror.zip | awk '{print $4}' | grep -c 'Apps/[^/]*/docker-compose.yml$')"
          echo "apps in the copy: ${apps}"
          test "${apps}" -gt 100

      # Two catalogue entries quote numbers the specification types as integers
      # (PsiTransfer's port target, ayon's healthcheck retries) and were refused
      # by the parser, so they were not in the store at all. And the store has to
      # stand on a third-party catalogue alone: upstream's grid goes blank with
      # only a v2-schema store registered (IceWhaleTech/CasaOS#2537), so the box
      # is switched to big-bear alone, restarted, and asked for its categories
      # and its apps, then switched back.
      - name: The store, with the apps that quote their numbers, and on a v2 catalogue alone
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            apps="$(curl -fsS "${CASA_URL}/v2/app_management/apps" -H "Authorization: ${CASA_TOKEN}" | jq -r '.data.list // {} | keys | length')"
            [ "${apps}" -gt 50 ] && break
            sleep 5
          done
          echo "apps in the store: ${apps}"
          test "${apps}" -gt 50
          # The store hides an app whose images are not built for this machine,
          # and the two apps this looks for are amd64-only: on arm64 the count
          # above is the evidence (377 against 421 on the v0.4.85 run).
          if [ "${{ matrix.arch }}" = amd64 ]; then
            curl -fsS "${CASA_URL}/v2/app_management/apps" -H "Authorization: ${CASA_TOKEN}" \
              | jq -e '.data.list | (has("psitransfer") or has("PsiTransfer")) and (has("ayon") or has("big-bear-ayon"))' >/dev/null
            echo "psitransfer and ayon are in the store"
          fi
          sudo cp /etc/casaos/app-management.conf /tmp/app-management.conf.orig
          sudo sed -i '/^appstore = .*IceWhaleTech/d' /etc/casaos/app-management.conf
          grep -c '^appstore = ' /etc/casaos/app-management.conf
          sudo systemctl restart casaos-app-management
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${CASA_URL}/v2/app_management/categories" -H "Authorization: ${CASA_TOKEN}" || true)"
            [ "${code}" = 200 ] && n="$(curl -fsS "${CASA_URL}/v2/app_management/apps" -H "Authorization: ${CASA_TOKEN}" | jq -r '.data.list // {} | keys | length')" && [ "${n}" -gt 5 ] && break
            sleep 5
          done
          categories="$(curl -fsS "${CASA_URL}/v2/app_management/categories" -H "Authorization: ${CASA_TOKEN}")"
          echo "${categories}" | jq -c '.data | map(.name)'
          jq -e '.data | length > 1 and all(.name != null and .name != "")' <<<"${categories}" >/dev/null
          echo "apps on the v2 catalogue alone: ${n}"
          sudo cp /tmp/app-management.conf.orig /etc/casaos/app-management.conf
          sudo systemctl restart casaos-app-management
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "${CASA_URL}/v2/app_management/apps" -H "Authorization: ${CASA_TOKEN}" && break
            sleep 3
          done

      # What the box has to say for itself, when a step above failed: the
      # service logs, the daemon's job list, the containers. Without this a red
      # run says which step and nothing else, and the machine is gone.
      - name: Diagnostics
        if: failure()
        run: |
          set +e
          # a service that exits 127 before it says anything: run the binaries by
          # hand, and watch the one that will not start
          echo "::group::the binaries, by hand"
          for b in /usr/bin/casaos /usr/bin/casaos-gateway /usr/bin/casaos-user-service /usr/bin/casaos-message-bus /usr/bin/casaos-local-storage /usr/bin/casaos-app-management; do
            printf '%s: ' "$b"; ls -la "$b" 2>&1 | tail -1; sudo "$b" -v 2>&1 | head -2; echo "rc=$?"
          done
          sudo apt-get install -y -q strace >/dev/null 2>&1 || true
          sudo strace -f -o /tmp/strace.txt /usr/bin/casaos-app-management -v 2>&1 | head -3 || true
          tail -n 25 /tmp/strace.txt 2>/dev/null
          uname -a; mount | grep -E " / | /usr " 
          echo "::endgroup::"
          echo "::group::casaos-app-management"
          sudo tail -n 200 /var/log/casaos/app-management.log 2>/dev/null
          sudo journalctl -u casaos-app-management --no-pager -n 100
          echo "::endgroup::"
          echo "::group::rclone"
          sudo journalctl -u rclone --no-pager -n 50
          sudo rclone rc --unix-socket /var/run/rclone/rclone.sock job/list 2>&1
          sudo rclone rc --unix-socket /var/run/rclone/rclone.sock config/listremotes 2>&1
          echo "::endgroup::"
          echo "::group::docker + files"
          docker ps -a --format '{{.Names}} {{.Status}} {{.Image}}'
          sudo find /var/tmp/casaos-backup-smoke -maxdepth 4 2>/dev/null | head -50
          sudo cat /var/lib/casaos/backups/runs.json 2>/dev/null
          echo "::endgroup::"

      - name: Keep the installer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-check-${{ inputs.tag }}-${{ matrix.arch }}
          path: |
            install.log
            backup-files.txt
          if-no-files-found: ignore
